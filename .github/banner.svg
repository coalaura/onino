<svg xmlns="http://www.w3.org/2000/svg" aria-label="onino" aria-describedby="description" viewBox="0 0 1120 320"><desc id="description">A racing onion forms the first o of onino: purple layers sweep into speed trails around a cream center, with green shoots leaning into the wind. CPU-only vanity .onion search. The name is oni[on ⇄ no]: onion with its final on reversed to no.</desc><style>.wordmark{fill:#f3eedf}.skin{fill:#b178d3}.layer{fill:#7d4698}.flesh{fill:#f3eedf}.shoot{fill:#98bf60}.shoot-shadow{fill:#719a35}.subtitle{fill:#c6b5d6;font-family:Arial,sans-serif;font-size:28px}.etymology{font-family:Consolas,monospace}.flipped{fill:#98bf60}</style><defs><path id="letter-n" d="M0 0h31v17C43 3 60-4 81-4c37 0 59 24 59 63v73h-32V64c0-25-11-39-31-39-28 0-45 18-45 47v60H0Z"/><path id="letter-o" fill-rule="evenodd" d="M74-4c46 0 77 27 77 69 0 43-31 71-77 71S-3 108-3 65C-3 23 28-4 74-4m0 29c-27 0-45 16-45 40 0 25 18 42 45 42 28 0 45-17 45-42 0-24-17-40-45-40"/></defs><g id="racing-onion"><path d="M345 113c6-29-1-51-20-73 34 8 52 35 39 70Z" class="shoot-shadow"/><path d="M350 112c-22-38-60-40-91-58 48-3 87 14 103 50Z" class="shoot"/><path d="M356 106c9-27 32-44 67-49-21 16-32 33-35 51l-19 14Z" class="shoot"/><path d="M354 98c-12 14-35 19-63 24H106l46 17h108c-16 7-26 16-31 29H64l55 17h108c2 13 8 24 20 34H147l47 17h88c17 7 35 10 57 9 41-2 73-19 87-44 24-46-16-69-43-82-16-8-24-14-29-21" class="skin"/><path d="M353 119c-18 16-62 16-81 38-21 24-2 56 30 68 39 15 87-5 99-34 13-32-24-50-48-72" class="flesh"/><path d="M353 140c-16 13-47 11-64 29-15 16 0 36 23 43 27 9 60-4 69-23 10-20-14-35-28-49" class="layer"/><path d="M351 160c-13 10-33 6-42 20-11 16 15 25 35 19 22-7 23-20 7-39" class="flesh"/></g><g class="wordmark" transform="translate(457 106)skewX(-10)"><use href="#letter-n"/><path d="M181 0h32v132h-32Zm0-47h32v30h-32Z"/><use x="251" href="#letter-n"/><use x="433" href="#letter-o"/></g><g class="subtitle" aria-label="oni[on ⇄ no] — CPU-only vanity .onion search"><text x="260