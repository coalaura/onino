<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 900" role="img" aria-labelledby="title desc">
<title id="title">CPU prefix comparison — onino v0.2.1</title>
<desc id="desc">Five samples per tool and workload on a Ryzen 9 9950X3D with 32 workers. Only onino auto was refreshed for v0.2.1; AVX2 and competitor results are retained. Bars show median million candidates per second; whiskers show minimum and maximum. The somethingrare prefix produced no matches. Four hello samples used temporary key-output directories after filesystem rename failures.</desc>
