<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 1190" role="img" aria-labelledby="title desc">
<title id="title">CPU and GPU prefix comparison — onino v0.3.0</title>
<desc id="desc">Five samples per configuration and workload on a Ryzen 9 9950X3D with 32 CPU workers and an RTX 5090 for combined runs. Series: mkp224o CPU, onionloom CPU, onino CPU AVX2, onino CPU AVX-512, onionloom CPU+GPU, onino CPU AVX-512+GPU. Competitor CPU results are retained; both onino CPU modes and both combined configurations are newly measured. Bars show median million candidates per second; whiskers show minimum and maximum. Rates use progress-counter deltas; onino counters have three significant digits. Key output was enabled; somethingrare produced no matches.</desc>
<style>svg{color-scheme:dark}text{font-family:Segoe UI,Arial,sans-serif;font-size:18px;fill:#b6c2d2}.title{font-size:32px;font-weight:600;fill:#e2e8f0}.heading{font-size:21px;font-weight:600;fill:#e2e8f0}.small{font-size:15px}.grid{stroke:#8592a3;stroke-opacity:0.22}.series{fill:none;stroke-width:3}.range{fill:none;stroke-width:1.5}</style>
