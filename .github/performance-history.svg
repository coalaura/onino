<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1030" viewBox="0 0 1200 1030" role="img" aria-labelledby="title description">
	<title id="title">Onino search performance over eighteen cumulative milestones</title>
	<desc id="description">Total nanoseconds per checked key, lower is better. Rare-prefix search falls from 125.5 to 39.21 ns/key, a 3.20-fold throughput increase. Searching 512 anywhere patterns falls from 348.3 to 62.25 ns/key, a 5.60-fold throughput increase. Dots are medians of five one-second samples for steps 00–15 and ten for steps 16–17; vertical whiskers show the full range. Both panels start at zero. Stage numbers follow implementation order, not elapsed time. Numerical results and measurement details accompany this image.</desc>
	<style>
		:root { color-scheme: light dark; }
		text { fill: #64748b; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 16px; }
		polyline { fill: none; stroke-width: 2.5; stroke-linejoin: round; }
		circle { stroke: none; }
		.title { fill: #475569; font-size: 28px; font-weight: 650; }
		.section { fill: #475569; font-size: 17px; font-weight: 650; letter-spacing: 1.2px; }
		.summary { font-size: 19px; }
		.grid { fill: none; stroke: #8592a3; stroke-opacity: 0.25; stroke-width: 1; }
		.axis { fill: none; stroke: #8592a3; stroke-opacity: 0.6; stroke-width: 1; }
		.ticks text { font-size: 14px; font-variant-numeric: tabular-nums; }
		.series { fill: currentColor; stroke: currentColor; }
		.range { fill: none; stroke-width: 1.5; stroke-opacity: 0.5; }
		.rare { color: #3281d4; }
		.frequent { color: #be7818; }
		.frequent polyline { stroke-dasharray: 7 5; }
		.dictionary512 { color: #9a72d9; }
		.dictionary64 { color: #d9764f; }
		.dictionary64 polyline { stroke-dasharray: 9 4; }
		.prefix512 { color: #159b8e; }
		.prefix512 polyline { stroke-dasharray: 3 5; }
		.step { font-weight: 650; font-variant-numeric: tabular-nums; }
		.footer { font-size: 14px; }
		@media (prefers-color-scheme: dark) {
			text { fill: #b6c2d2; }
			.title, .section { fill: #e2e8f0; }
		}
	</style>
