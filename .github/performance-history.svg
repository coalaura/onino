	<text class="section" x="44" y="783">CHANGES ADDED AT EACH STEP</text>
	<g>
		<text x="72" y="816"><tspan class="step">00</tspan><tspan x="111">First batched projective search</tspan></text>
		<text x="72" y="843"><tspan class="step">01</tspan><tspan x="111">Four-limb BMI2/ADX arithmetic</tspan></text>
		<text x="72" y="870"><tspan class="step">02</tspan><tspan x="111">Defer X/sign work until a filter hit</tspan></text>
		<text x="72" y="897"><tspan class="step">03</tspan><tspan x="111">Fuse mixed point addition</tspan></text>
		<text x="72" y="924"><tspan class="step">04</tspan><tspan x="111">Triplet-bucket dictionary matcher</tspan></text>
		<text x="72" y="951"><tspan class="step">05</tspan><tspan x="111">Stride-four dictionary scanning</tspan></text>
		<text x="72" y="978"><tspan class="step">06</tspan><tspan x="111">Indexed prefix/suffix matching</tspan></text>
		<text x="72" y="1005"><tspan class="step">07</tspan><tspan x="111">Targeted PACE matcher inlining</tspan></text>
		<text x="630" y="816"><tspan class="step">08</tspan><tspan x="669">Fuse reverse normalization</tspan></text>
		<text x="630" y="843"><tspan class="step">09</tspan><tspan x="669">Assembly address displacements</tspan></text>
		<text x="630" y="870"><tspan class="step">10</tspan><tspan x="669">Paired affine generation + fallback</tspan></text>
		<text x="630" y="897"><tspan class="step">11</tspan><tspan x="669">Fuse paired arithmetic loops</tspan></text>
		<text x="630" y="924"><tspan class="step">12</tspan><tspan x="669">Dictionary crossover: 128 → 32</tspan></text>
		<text x="630" y="951"><tspan class="step">13</tspan><tspan x="669">Periodic progress reporting</tspan></text>
		<text x="630" y="978"><tspan class="step">14</tspan><tspan x="669">Share paired reciprocal product</tspan></text>
		<text x="630" y="1005"><tspan class="step">15</tspan><tspan x="669">Dedicated BMI2/ADX square</tspan></text>
	</g>
	<text class="footer" x="44" y="1046">Dots: median of 5 × 1s samples · whiskers: min–max · 0 allocations · equal milestone spacing, not elapsed time</text>
