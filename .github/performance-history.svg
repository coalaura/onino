	<text class="section" x="44" y="783">CHANGES ADDED AT EACH STEP</text>
	<g>
		<text x="44" y="816"><tspan class="step">00</tspan><tspan x="80">First batched projective search</tspan></text>
		<text x="44" y="843"><tspan class="step">01</tspan><tspan x="80">Four-limb BMI2/ADX arithmetic</tspan></text>
		<text x="44" y="870"><tspan class="step">02</tspan><tspan x="80">Defer X/sign work until a filter hit</tspan></text>
		<text x="44" y="897"><tspan class="step">03</tspan><tspan x="80">Fuse mixed point addition</tspan></text>
		<text x="44" y="924"><tspan class="step">04</tspan><tspan x="80">Triplet-bucket dictionary matcher</tspan></text>
		<text x="44" y="951"><tspan class="step">05</tspan><tspan x="80">Stride-four dictionary scanning</tspan></text>
		<text x="432" y="816"><tspan class="step">06</tspan><tspan x="468">Indexed prefix/suffix matching</tspan></text>
		<text x="432" y="843"><tspan class="step">07</tspan><tspan x="468">Targeted PACE matcher inlining</tspan></text>
		<text x="432" y="870"><tspan class="step">08</tspan><tspan x="468">Fuse reverse normalization</tspan></text>
		<text x="432" y="897"><tspan class="step">09</tspan><tspan x="468">Assembly address displacements</tspan></text>
		<text x="432" y="924"><tspan class="step">10</tspan><tspan x="468">Paired affine generation + fallback</tspan></text>
		<text x="432" y="951"><tspan class="step">11</tspan><tspan x="468">Fuse paired arithmetic loops</tspan></text>
		<text x="820" y="816"><tspan class="step">12</tspan><tspan x="856">Dictionary crossover: 128 → 32</tspan></text>
		<text x="820" y="843"><tspan class="step">13</tspan><tspan x="856">Periodic progress reporting</tspan></text>
		<text x="820" y="870"><tspan class="step">14</tspan><tspan x="856">Share paired reciprocal product</tspan></text>
		<text x="820" y="897"><tspan class="step">15</tspan><tspan x="856">Dedicated BMI2/ADX square</tspan></text>
		<text x="820" y="924"><tspan class="step">16</tspan><tspan x="856">Adjacent-symbol fingerprints</tspan></text>
		<text x="820" y="951"><tspan class="step">17</tspan><tspan x="856">Constant-time divsteps inversion</tspan></text>
	</g>
	<text class="footer" x="44" y="990">Dots: median · 5 × 1s samples at steps 00–15; 10 × 1s at 16–17 · whiskers: min–max · 0 allocations</text>
	<text class="footer" x="44" y="1012">Same full-search harness · steps 16–17 measured in a later alternating run · equal milestone spacing, not elapsed time</text>
</svg>
